# 静态演示站：只托管构建产物，不反代任何后端。
# 部署：npm run build:demo 后，把 web/dist-demo 放到 root 指向的目录。
server {
    listen 80;
    server_name demo.example.com;
    root /var/www/platform-demo/dist-demo;
    index index.html;

    # 演示站没有任何 API；显式 404，避免误配到真实后端。
    location /api/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(mp4|png|jpg|jpeg|svg|ico|css|js)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
