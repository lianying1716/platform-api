# 项目名可覆盖：同一台宿主可以跑多套实例，备份/升级也按这个项目名解析卷。
# 未设置时固定为 platform-api，避免目录改名 / worktree 导致 compose 与 updater 失配。
name: ${COMPOSE_PROJECT_NAME:-platform-api}

services:
  platform-api:
    # 升级 = 改 PLATFORM_VERSION 后 `docker compose pull && docker compose up -d`
    # （同 Immich/Gitea 的镜像 tag 驱动）。本地开发想从源码构建用 override 文件。
    image: ${PLATFORM_IMAGE:-ghcr.io/lianying1716/platform-api}:${PLATFORM_VERSION:-latest}
    # 左边是宿主端口（可改），右边容器内端口固定 9100：健康检查和容器网络依赖它。
    ports:
      - "${PLATFORM_PORT:-9100}:9100"
    environment:
      # 结构化字段由 app/config.py 生成 URL；密码含 @ : / 等字符也无需手工转义。
      # 需要外部托管数据库时，再填完整 PLATFORM_DATABASE_URL 覆盖。
      PLATFORM_DATABASE_URL: ${PLATFORM_DATABASE_URL:-}
      PLATFORM_DB_HOST: ${PLATFORM_DB_HOST:-db}
      PLATFORM_DB_PORT: ${PLATFORM_DB_PORT:-5432}
      PLATFORM_DB_USER: ${PLATFORM_DB_USER:-platform}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:-platform}
      PLATFORM_DB_NAME: ${PLATFORM_DB_NAME:-platform}
      PLATFORM_AUTO_CREATE_TABLES: "false"
      PLATFORM_RUN_MIGRATIONS: "true"      # 由 api 负责迁移（契约 I2）
      PLATFORM_AUTO_MIGRATE: ${PLATFORM_AUTO_MIGRATE:-true}
      PLATFORM_ALLOW_UNKNOWN_DB: ${PLATFORM_ALLOW_UNKNOWN_DB:-false}
      PLATFORM_SERVE_FRONTEND: ${PLATFORM_SERVE_FRONTEND:-true}
      PLATFORM_CREDENTIAL_ENC_KEY: ${PLATFORM_CREDENTIAL_ENC_KEY:-}
      # Egress policy lives at deployment level (single source of truth for
      # API + worker).  Empty keeps direct connections.
      PLATFORM_OUTBOUND_PROXY: ${PLATFORM_OUTBOUND_PROXY:-}
      PLATFORM_PLATFORM_PROXIES: ${PLATFORM_PLATFORM_PROXIES:-}
      # Legacy llm_* variables are consumed once at startup and claimed into
      # AiProvider; runtime business paths never read them.
      PLATFORM_LLM_BASE_URL: ${PLATFORM_LLM_BASE_URL:-}
      PLATFORM_LLM_API_KEY: ${PLATFORM_LLM_API_KEY:-}
      PLATFORM_LLM_MODEL: ${PLATFORM_LLM_MODEL:-}
      PLATFORM_ACCOUNT_CHECK_INTERVAL: ${PLATFORM_ACCOUNT_CHECK_INTERVAL:-15}
      PLATFORM_SUBSCRIPTION_SCAN_INTERVAL: ${PLATFORM_SUBSCRIPTION_SCAN_INTERVAL:-5}
      PLATFORM_RATE_LIMIT_PER_MINUTE: ${PLATFORM_RATE_LIMIT_PER_MINUTE:-12}
      PLATFORM_CRAWL_TIMEOUT_SECONDS: ${PLATFORM_CRAWL_TIMEOUT_SECONDS:-600}
      PLATFORM_QR_SESSION_TTL: ${PLATFORM_QR_SESSION_TTL:-300}
      PLATFORM_QR_BROWSER_ENGINE: ${PLATFORM_QR_BROWSER_ENGINE:-auto}
      # 一键升级：仅在设置了这两个变量时才启用（默认关闭 → 前端不显示升级按钮）。
      PLATFORM_UPDATER_URL: ${PLATFORM_UPDATER_URL:-}
      PLATFORM_UPDATER_TOKEN: ${PLATFORM_UPDATER_TOKEN:-}
      # 检查更新读取 GitHub Releases；fork 用户可改仓库，不透明 token 可避免 60 次/小时限流。
      PLATFORM_UPDATE_REPO: ${PLATFORM_UPDATE_REPO:-lianying1716/platform-api}
      PLATFORM_UPDATE_GITHUB_TOKEN: ${PLATFORM_UPDATE_GITHUB_TOKEN:-}
      # 存储目录可视化选择：允许在网页「选择目录」里浏览的白名单根（`:` 分隔）。
      # 留空 = 容器内安全默认（只放行 /data）。要让用户选到宿主目录，先把宿主目录
      # bind mount 进来（见下面 volumes 注释），再把容器内的挂载点列在这里。
      PLATFORM_BROWSE_ROOTS: ${PLATFORM_BROWSE_ROOTS:-}
    volumes:
      - platform-data:/data        # secret.key 与本地文件；备份必须包含此卷
      # 例：把宿主候选目录挂进容器，供「存储目录」可视化选择（宿主机路径:容器内路径）。
      #   宿主 NAS  /volume1/xsai  →  容器 /mnt/nas
      #   宿主 本地 /srv/xsai      →  容器 /mnt/local
      # 再把 PLATFORM_BROWSE_ROOTS=/data:/mnt/nas:/mnt/local 打开即可。
      # - ${STORAGE_NAS:-./data/nas}:/mnt/nas
      # - ${STORAGE_LOCAL:-./data/local}:/mnt/local
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:9100/api/auth/status").status == 200 else 1)
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  platform-worker:
    image: ${PLATFORM_IMAGE:-ghcr.io/lianying1716/platform-api}:${PLATFORM_VERSION:-latest}
    command: ["python", "-m", "app.workers.runner"]
    environment:
      PLATFORM_DATABASE_URL: ${PLATFORM_DATABASE_URL:-}
      PLATFORM_DB_HOST: ${PLATFORM_DB_HOST:-db}
      PLATFORM_DB_PORT: ${PLATFORM_DB_PORT:-5432}
      PLATFORM_DB_USER: ${PLATFORM_DB_USER:-platform}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:-platform}
      PLATFORM_DB_NAME: ${PLATFORM_DB_NAME:-platform}
      PLATFORM_AUTO_CREATE_TABLES: "false"
      PLATFORM_RUN_MIGRATIONS: "false"     # worker 不迁移，等 api 健康后再起（契约 I2）
      PLATFORM_AUTO_MIGRATE: ${PLATFORM_AUTO_MIGRATE:-true}
      PLATFORM_ALLOW_UNKNOWN_DB: ${PLATFORM_ALLOW_UNKNOWN_DB:-false}
      PLATFORM_CREDENTIAL_ENC_KEY: ${PLATFORM_CREDENTIAL_ENC_KEY:-}
      PLATFORM_OUTBOUND_PROXY: ${PLATFORM_OUTBOUND_PROXY:-}
      PLATFORM_PLATFORM_PROXIES: ${PLATFORM_PLATFORM_PROXIES:-}
      PLATFORM_LLM_BASE_URL: ${PLATFORM_LLM_BASE_URL:-}
      PLATFORM_LLM_API_KEY: ${PLATFORM_LLM_API_KEY:-}
      PLATFORM_LLM_MODEL: ${PLATFORM_LLM_MODEL:-}
      PLATFORM_WORKER_CONCURRENCY: ${PLATFORM_WORKER_CONCURRENCY:-2}
      PLATFORM_WHISPER_MODEL: ${PLATFORM_WHISPER_MODEL:-base}
      PLATFORM_WHISPER_DEVICE: ${PLATFORM_WHISPER_DEVICE:-auto}
      PLATFORM_WHISPER_COMPUTE_TYPE: ${PLATFORM_WHISPER_COMPUTE_TYPE:-int8}
      PLATFORM_DOWNLOAD_MIN_GAP_SECONDS: ${PLATFORM_DOWNLOAD_MIN_GAP_SECONDS:-4}
      PLATFORM_DOWNLOAD_JITTER_SECONDS: ${PLATFORM_DOWNLOAD_JITTER_SECONDS:-6}
      PLATFORM_RATE_LIMIT_PER_MINUTE: ${PLATFORM_RATE_LIMIT_PER_MINUTE:-12}
      PLATFORM_CRAWL_TIMEOUT_SECONDS: ${PLATFORM_CRAWL_TIMEOUT_SECONDS:-600}
    volumes:
      - platform-data:/data
      # 注意：worker 是真正落盘素材的进程，宿主候选目录也必须挂进 worker，
      # 且用**同一容器内路径**，否则列表里选得到、下载却写不进去。
      # - ${STORAGE_NAS:-./data/nas}:/mnt/nas
      # - ${STORAGE_LOCAL:-./data/local}:/mnt/local
    depends_on:
      db:
        condition: service_healthy
      platform-api:
        condition: service_healthy
    restart: unless-stopped

  # 一键升级边车：持有 docker socket，故与主服务隔离，且不映射任何宿主端口。
  # 只有设置了 PLATFORM_UPDATER_TOKEN 才真正生效（否则拒绝所有请求）。
  # 不需要网页一键升级时，可整段删除或用 profiles 排除。
  platform-updater:
    # 边车用专用镜像（主镜像 + docker CLI + compose 插件）；主镜像不含 docker 客户端。
    image: ${PLATFORM_UPDATER_IMAGE:-ghcr.io/lianying1716/platform-api-updater}:${PLATFORM_VERSION:-latest}
    environment:
      PLATFORM_UPDATER_TOKEN: ${PLATFORM_UPDATER_TOKEN:-}
      UPDATER_COMPOSE_FILE: /compose/docker-compose.yml
      # 与栈项目名一致，保证边车能 exec/重建到正确的容器。
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-platform-api}
      # 自定义数据库账号/库名时，边车备份也使用同一组值。
      POSTGRES_USER: ${PLATFORM_DB_USER:-platform}
      POSTGRES_DB: ${PLATFORM_DB_NAME:-platform}
      # 备份直接读挂进来的 data 卷目录（不依赖宿主卷名推导，避免 worktree/改名出错）
      UPDATER_DATA_DIR: /data
      UPDATER_BACKUP_DIR: /backups
      UPDATER_ENV_FILE: /compose/.env
      UPDATER_API_HEALTH_URL: http://platform-api:9100/api/system/version
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # updater 需要读 compose 文件来执行 pull/up；只读挂载，防止被改写。
      - ./docker-compose.yml:/compose/docker-compose.yml:ro
      # .env 可写挂入：升级成功后 updater 会把 PLATFORM_VERSION 写回这里（pin），
      # 否则重启/compose up 会按默认 tag 静默回退。create_host_path:false 让
      # .env 缺失时明确报错，而不是静默创建一个目录导致写入失败。
      - type: bind
        source: ./.env
        target: /compose/.env
        bind:
          create_host_path: false
      # 与 api/worker 共享 data 卷（只读），备份时直接 tar；含 secret.key。
      - platform-data:/data:ro
      # 备份产物持久化，回滚/排查用。
      - platform-backups:/backups
    depends_on:
      platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9200/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles: ["updater"]

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${PLATFORM_DB_USER:-platform}
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:-platform}
      POSTGRES_DB: ${PLATFORM_DB_NAME:-platform}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  platform-data:
  pg-data:
  platform-backups:
