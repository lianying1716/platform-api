services:
  platform-api:
    build: .
    ports:
      - "9100:9100"
    environment:
      PLATFORM_DATABASE_URL: postgresql+psycopg2://platform:platform@db:5432/platform
      PLATFORM_AUTO_CREATE_TABLES: "false"
      PLATFORM_ACCOUNT_CHECK_INTERVAL: "15"
    volumes:
      - platform-data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:9100/api/auth/status").status == 200 else 1)
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  platform-worker:
    build: .
    command: ["python", "-m", "app.workers.runner"]
    environment:
      PLATFORM_DATABASE_URL: postgresql+psycopg2://platform:platform@db:5432/platform
      PLATFORM_AUTO_CREATE_TABLES: "false"
    volumes:
      - platform-data:/data
    depends_on:
      db:
        condition: service_healthy
      platform-api:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  platform-data:
  pg-data:
