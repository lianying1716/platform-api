[project]
name = "platform-api"
version = "0.1.0"
description = "统一素材采集管理平台 - 后端主控层"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "cryptography>=43.0",
    "apscheduler>=3.10",
    "qrcode[pil]>=7.4",
    "pydantic-settings>=2.4",
    "yt-dlp>=2025.1.1",
    "xhshow>=0.1.9",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.45",
    "playwright-stealth>=2.0.3",
]
postgres = ["psycopg2-binary>=2.9"]
transcribe = ["faster-whisper>=1.0"]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
